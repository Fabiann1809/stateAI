[project]
name = "stateai-ml"
version = "0.1.0"
description = "Offline training, synthetic data and evaluation for stateAI"
requires-python = ">=3.12"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N", "SIM", "C90", "PL"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 6
max-statements = 40

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
